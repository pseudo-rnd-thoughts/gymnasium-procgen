[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "pybind11>=2.10.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "gymnasium-procgen"
version = "1.0.0"
description = "Procedurally Generated Game-Like RL Environments"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Farama Foundation", email = "jkterry@farama.org"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.19.0",
    "gym>=0.18.0",
    "gym3>=0.3.3",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0.0",
    "pytest-benchmark>=3.4.1",
    "pytest-xdist",
]
dev = [
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/Farama-Foundation/gymnasium-procgen"
Documentation = "https://gymnasium-procgen.farama.org"
Repository = "https://github.com/Farama-Foundation/gymnasium-procgen"
"Bug Tracker" = "https://github.com/Farama-Foundation/gymnasium-procgen/issues"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.verbose = true
wheel.expand-macos-universal-tags = true

# Include Python source files
wheel.packages = ["procgen"]

[tool.cibuildwheel.linux]
before-all = [
    "yum install -y qt6-qtbase-devel qt6-qtbase-static"
]

[tool.cibuildwheel.macos]
before-all = [
    "brew install qt@6"
]
environment = { CMAKE_PREFIX_PATH = "/usr/local/opt/qt@6" }

[tool.cibuildwheel.windows]
before-all = [
    "choco install qt6"
]
